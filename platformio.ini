[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.5.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000

build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
  -DDISABLE_FS_H_WARNING=1
  -DDESTRUCTOR_CLOSES_FILE=1
# https://libexpat.github.io/doc/api/latest/#XML_GE
  -DXML_GE=0
  -DXML_CONTEXT_BYTES=1024
  -std=gnu++2a
# Enable UTF-8 long file names in SdFat
  -DUSE_UTF8_LONG_NAMES=1
# German Liang hyphenation data costs about 200KB of flash. Leave it opt-in;
# German EPUBs still render and can break on explicit hyphens/fallback points.
   -DCPR_ENABLE_GERMAN_HYPHENATION=0
   -DCPR_ENABLE_LUA_PLUGINS=1
# Non-core hyphenation dictionaries (large trie data) are opt-in to keep the
# firmware under the 6.25MB flash partition. Books in these languages still
# render; hyphenation falls back to explicit hyphens/fallback points.
  -DCPR_ENABLE_SPANISH_HYPHENATION=0
  -DCPR_ENABLE_FRENCH_HYPHENATION=0
  -DCPR_ENABLE_POLISH_HYPHENATION=0
  -DCPR_ENABLE_RUSSIAN_HYPHENATION=0
  -DCPR_ENABLE_SWEDISH_HYPHENATION=0
  -DCPR_ENABLE_UKRAINIAN_HYPHENATION=0
# PNG decode scanline buffer: reserve for current + previous line.
# Default: (320*4+1)*2 = 2562 bytes (320px max width at 32bpp)
# 8192 supports up to (8192/2-1)/4 = 1023 px wide — enough for X4 (800px).
# Increased from default to support landscape screensaver images.
  -DPNG_MAX_BUFFERED_PIXELS=8192
  -Wno-bidi-chars
  -Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
  -fno-exceptions
; Font omission flags: each saves ~60-80 KB flash by replacing built-in
; font data with NotoSans (compiled in for Vietnamese/EPUB fallback).
; Remove any of these to restore the original font if flash budget allows.
    -DOMIT_LEXEND
    -DOMIT_BOOKERLY
  -DARDUINO_LOOP_STACK_SIZE=9216

build_unflags =
  -std=gnu++11
  -fexceptions

; Board configuration
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv

extra_scripts =
  pre:scripts/build_html.py
  pre:scripts/gen_i18n.py
  pre:scripts/git_branch.py
  pre:scripts/patch_jpegdec.py
  post:scripts/package_vcodex_bin.py

; Libraries
lib_deps =
  BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
  InputManager=symlink://freeink-sdk/libs/hardware/InputManager
  EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
  SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
  BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
  XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
  PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
  bblanchon/ArduinoJson @ 7.4.2
  ricmoo/QRCode @ 0.0.1
  bitbank2/PNGdec @ 1.1.6
  https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
  links2004/WebSockets @ 2.7.3

[env:default]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is generated in artifacts/build-version.json and src/version.generated.inc
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=2 ; Set log level to debug for development builds
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1


[env:gh_release]
extends = base
build_flags =
  ${base.build_flags}
  ; CROSSPOINT_VERSION is generated in artifacts/build-version.json for release builds
  ; serial output is disabled in release builds to save flash and avoid log strings
  -UENABLE_SERIAL_LOG
  -DCPR_DISABLE_EVENT_LOGS=1
  -DLOG_LEVEL=-1
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1

[env:gh_release_rc]
extends = base
build_flags =
  ${base.build_flags}
  -DENABLE_SERIAL_LOG
  -DLOG_LEVEL=1 ; Set log level to info for release candidate builds
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1  

[env:slim]
extends = base
build_flags =
  ${base.build_flags}
  ; serial output is disabled in slim builds to save space
  -DFREEINK_DEVICE_X4=1
  -DFREEINK_DEVICE_X3=1
  -UENABLE_SERIAL_LOG

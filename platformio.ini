; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = default
build_cache_dir = .cache
extra_configs = platformio.local.ini

[crosspoint]
version = 1.6.0

[base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600
check_tool = cppcheck
check_flags = --enable=all --suppress=missingIncludeSystem --suppress=missingInclude --suppress=unusedFunction --suppress=unmatchedSuppression --suppress=*:*/.pio/* --inline-suppr
check_skip_packages = yes
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_upload.offset_address = 0x10000
build_flags = 
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
	-DDISABLE_FS_H_WARNING=1
	-DDESTRUCTOR_CLOSES_FILE=1
	-DXML_GE=0
	-DXML_CONTEXT_BYTES=1024
	-std=gnu++2a
	-DUSE_UTF8_LONG_NAMES=1
	-DCPR_ENABLE_GERMAN_HYPHENATION=0
	-DPNG_MAX_BUFFERED_PIXELS=16416
	-Wno-bidi-chars
	-Wl,--wrap=panic_print_backtrace,--wrap=panic_abort,--wrap=bootloader_common_check_efuse_blk_validity
	-fno-exceptions
	-I src
	-I lib
	-I lib/Epub
build_unflags = 
	-std=gnu++11
	-fexceptions
board_build.flash_mode = dio
board_build.flash_size = 16MB
board_build.partitions = partitions.csv
extra_scripts = 
	pre:scripts/patch_pioarduino_cache.py
	pre:scripts/build_html.py
	pre:scripts/gen_i18n.py
	pre:scripts/git_branch.py
	pre:scripts/patch_jpegdec.py
	pre:scripts/patch_pngdec.py
	post:scripts/register_unit_tests_target.py
	post:scripts/package_vcodex_bin.py
lib_deps = 
	BatteryMonitor=symlink://freeink-sdk/libs/hardware/BatteryMonitor
	InputManager=symlink://freeink-sdk/libs/hardware/InputManager
	EInkDisplay=symlink://freeink-sdk/libs/display/FreeInkDisplay
	SDCardManager=symlink://freeink-sdk/libs/hardware/SDCardManager
	UsbMassStorage=symlink://freeink-sdk/libs/hardware/UsbMassStorage
	BoardConfig=symlink://freeink-sdk/libs/hardware/BoardConfig
	XteinkDetect=symlink://freeink-sdk/libs/hardware/XteinkDetect
	PowerManager=symlink://freeink-sdk/libs/hardware/PowerManager
	FrontlightManager=symlink://freeink-sdk/libs/hardware/FrontlightManager
	Rtc=symlink://freeink-sdk/libs/hardware/Rtc
	Imu=symlink://freeink-sdk/libs/hardware/Imu
	FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
	Icons=symlink://freeink-sdk/libs/assets/Icons
	bblanchon/ArduinoJson @ 7.4.2
	ricmoo/QRCode @ 0.0.1
	bitbank2/PNGdec @ 1.1.6
	https://github.com/bitbank2/JPEGDEC.git#86282979224c8a32fd51e091ed5a35b0c699a52b
	links2004/WebSockets @ 2.7.3
lib_ignore = 
	BLE

[firmware_tuned]
custom_sdkconfig = 
	CONFIG_ESP_TIMER_TASK_STACK_SIZE=4096
	CONFIG_FREERTOS_TIMER_TASK_STACK_DEPTH=2560
	CONFIG_ESP_WIFI_IRAM_OPT=n
	CONFIG_ESP_WIFI_RX_IRAM_OPT=n
	CONFIG_ARDUINO_SELECTIVE_COMPILATION=y
	CONFIG_ARDUINO_SELECTIVE_RainMaker=n
	CONFIG_ARDUINO_SELECTIVE_Insights=n
	CONFIG_ARDUINO_SELECTIVE_ESP_SR=n
custom_component_remove = 
	espressif/esp_insights
	espressif/esp_rainmaker
	espressif/esp_diagnostics
	espressif/esp_diag_data_store
	espressif/esp_schedule
	espressif/esp_rcp_update
	espressif/esp_secure_cert_mgr
	espressif/cbor

[env:default]
extends = base, firmware_tuned
build_flags = 
	${base.build_flags}
	-DFREEINK_DEVICE_X4=1
	-DFREEINK_DEVICE_X3=1
	-DENABLE_SERIAL_LOG
	-DCROSSPOINT_WAIT_FOR_USB_SERIAL
	-DOMIT_LEXEND
	-DOMIT_BOOKERLY
	-DLOG_LEVEL=1
platform_packages = platformio/tool-scons@~4.41101.0

[env:gh_release]
extends = base, firmware_tuned
build_flags = 
	${base.build_flags}
	-DFREEINK_DEVICE_X4=1
	-DFREEINK_DEVICE_X3=1
	-UENABLE_SERIAL_LOG
	-DCPR_DISABLE_EVENT_LOGS=1
	-DOMIT_LEXEND
	-DOMIT_BOOKERLY
	-DLOG_LEVEL=-1
platform_packages = platformio/tool-scons@~4.41101.0

[env:gh_release_rc]
extends = base, firmware_tuned
build_flags = 
	${base.build_flags}
	-DFREEINK_DEVICE_X4=1
	-DFREEINK_DEVICE_X3=1
	-DENABLE_SERIAL_LOG
	-DOMIT_LEXEND
	-DOMIT_BOOKERLY
	-DLOG_LEVEL=1
platform_packages = platformio/tool-scons@~4.41101.0

[env:slim]
extends = base, firmware_tuned
build_flags = 
	${base.build_flags}
	-DFREEINK_DEVICE_X4=1
	-DFREEINK_DEVICE_X3=1
	-UENABLE_SERIAL_LOG
	-DOMIT_LEXEND
	-DOMIT_BOOKERLY
platform_packages = platformio/tool-scons@~4.41101.0

[env:x4pro]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
board_build.partitions = partitions_x4pro.csv
extra_scripts = 
	pre:scripts/patch_wolfssl.py
	${base.extra_scripts}
lib_deps = 
	${base.lib_deps}
	SecureNet=symlink://freeink-sdk/libs/network/SecureNet
	wolfssl/Arduino-wolfSSL @ 5.7.2
build_flags = 
	${base.build_flags}
	-DFREEINK_DEVICE_X4PRO=1
	-DFREEINK_CAP_USB_MSC=1
	-DBOARD_HAS_PSRAM
	-DUSB_PRODUCT=\"CPR_vCodex_X4_Pro\"
	-DUSB_MANUFACTURER=\"CPR-vCodex\"
	-DENABLE_SERIAL_LOG
	-DCROSSPOINT_WAIT_FOR_USB_SERIAL
	-DLOG_LEVEL=2
	-DFREEINK_NET_WOLFSSL=1
	-DWOLFSSL_USER_SETTINGS
	-DWOLFSSL_OPTIONS_H
	-DWOLFSSL_CLIENT_EXAMPLE
	-DWOLFSSL_TLS13
	-DWOLFSSL_HAVE_SP_ECC
	-DWOLFSSL_SP_SMALL
	-DHAVE_FFDHE_2048
	-DHAVE_CURVE25519
	-DHAVE_SNI
	-DHAVE_MAX_FRAGMENT
	-DUSE_BLOCK_DEVICE_INTERFACE=1
platform_packages = platformio/tool-scons@~4.41101.0

[env:x4pro-gh_release]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
board_build.partitions = partitions_x4pro.csv
extra_scripts = 
	pre:scripts/patch_wolfssl.py
	${base.extra_scripts}
lib_deps = 
	${base.lib_deps}
	SecureNet=symlink://freeink-sdk/libs/network/SecureNet
	wolfssl/Arduino-wolfSSL @ 5.7.2
build_flags = 
	${base.build_flags}
	-DFREEINK_DEVICE_X4PRO=1
	-DFREEINK_CAP_USB_MSC=1
	-DBOARD_HAS_PSRAM
	-DUSB_PRODUCT=\"CPR_vCodex_X4_Pro\"
	-DUSB_MANUFACTURER=\"CPR-vCodex\"
	-UENABLE_SERIAL_LOG
	-DCPR_DISABLE_EVENT_LOGS=1
	-DLOG_LEVEL=-1
	-DFREEINK_NET_WOLFSSL=1
	-DWOLFSSL_USER_SETTINGS
	-DWOLFSSL_OPTIONS_H
	-DWOLFSSL_CLIENT_EXAMPLE
	-DWOLFSSL_TLS13
	-DWOLFSSL_HAVE_SP_ECC
	-DWOLFSSL_SP_SMALL
	-DHAVE_FFDHE_2048
	-DHAVE_CURVE25519
	-DHAVE_SNI
	-DHAVE_MAX_FRAGMENT
	-DUSE_BLOCK_DEVICE_INTERFACE=1
platform_packages = platformio/tool-scons@~4.41101.0

[env:x4pro-gh_release_rc]
extends = base
board = esp32-s3-devkitc1-n16r8
board_build.mcu = esp32s3
board_build.arduino.memory_type = dio_opi
board_build.partitions = partitions_x4pro.csv
extra_scripts = 
	pre:scripts/patch_wolfssl.py
	${base.extra_scripts}
lib_deps = 
	${base.lib_deps}
	SecureNet=symlink://freeink-sdk/libs/network/SecureNet
	wolfssl/Arduino-wolfSSL @ 5.7.2
build_flags = 
	${base.build_flags}
	-DFREEINK_DEVICE_X4PRO=1
	-DFREEINK_CAP_USB_MSC=1
	-DBOARD_HAS_PSRAM
	-DUSB_PRODUCT=\"CPR_vCodex_X4_Pro\"
	-DUSB_MANUFACTURER=\"CPR-vCodex\"
	-DENABLE_SERIAL_LOG
	-DLOG_LEVEL=1
	-DFREEINK_NET_WOLFSSL=1
	-DWOLFSSL_USER_SETTINGS
	-DWOLFSSL_OPTIONS_H
	-DWOLFSSL_CLIENT_EXAMPLE
	-DWOLFSSL_TLS13
	-DWOLFSSL_HAVE_SP_ECC
	-DWOLFSSL_SP_SMALL
	-DHAVE_FFDHE_2048
	-DHAVE_CURVE25519
	-DHAVE_SNI
	-DHAVE_MAX_FRAGMENT
	-DUSE_BLOCK_DEVICE_INTERFACE=1
platform_packages = platformio/tool-scons@~4.41101.0

[env:simulator]
platform = native
lib_ldf_mode = deep+
lib_compat_mode = off
build_src_filter = 
	+<*>
	-<network/FirmwareFlasher.cpp>
	-<network/OtaBootSwitch.cpp>
	-<network/OtaUpdater.cpp>
	-<platform/skip_efuse_blk_check.c>
build_flags = 
	-std=gnu++2a
	!sdl2-config --cflags --libs
	-Wno-c++11-narrowing
	-DSIMULATOR
	-DFREEINK_DEVICE_X4=1
	-DCROSSPOINT_SIMULATOR_PROJECT_WEBSERVER
	-DENABLE_SERIAL_LOG
	-DLOG_LEVEL=2
	-DEINK_DISPLAY_SINGLE_BUFFER_MODE=1
	-DMINIZ_NO_ZLIB_COMPATIBLE_NAMES=1
	-DXML_GE=0
	-DXML_CONTEXT_BYTES=1024
	-DUSE_UTF8_LONG_NAMES=1
	-DPNG_MAX_BUFFERED_PIXELS=16416
	-DCPR_ENABLE_GERMAN_HYPHENATION=0
	-DDISABLE_FS_H_WARNING=1
	-DDESTRUCTOR_CLOSES_FILE=1
	-Isrc
lib_ignore = hal, PNGdec, JPEGDEC, WebSockets
extra_scripts = 
	pre:scripts/gen_i18n.py
	pre:scripts/git_branch.py
	pre:scripts/build_html.py
lib_deps = 
	simulator=https://github.com/boydj/crosspoint-simulator#cpr-vcodex
	FreeInkUI=symlink://freeink-sdk/libs/ui/FreeInkUI
	Icons=symlink://freeink-sdk/libs/assets/Icons
	bblanchon/ArduinoJson @ 7.4.2
	ricmoo/QRCode @ ^0.0.1
	https://github.com/bitbank2/AnimatedGIF.git#d01888f0255fd0781fc2b8600b9111b14c999584
	links2004/WebSockets @ 2.7.3
platform_packages = platformio/tool-scons@~4.41101.0

[env:simulator_x3]
extends = env:simulator
build_flags = 
	${env:simulator.build_flags}
	-DSIMULATOR_DEVICE_X3
	-DFREEINK_DEVICE_X3=1
platform_packages = platformio/tool-scons@~4.41101.0

[env:simulator_x4_pro]
extends = env:simulator
build_flags = 
	${env:simulator.build_flags}
	-DSIMULATOR_DEVICE_X4_PRO
	-UFREEINK_DEVICE_X4
	-DFREEINK_DEVICE_X4PRO=1
platform_packages = platformio/tool-scons@~4.41101.0

[env:simulator_x4_pro_wsl]
extends = env:simulator_x4_pro
build_unflags = 
	-Wno-c++11-narrowing
build_flags = 
	${env:simulator_x4_pro.build_flags}
	-Wno-narrowing
	-Wno-deprecated-declarations
	-lssl
	-lcrypto
	-pthread
	-Dmemcpy_P=memcpy
platform_packages = platformio/tool-scons@~4.41101.0
